name: Deploy

# Manual only — deliberately NOT on push, unlike the sibling tools.
# This app has door windows: an automatic deploy triggered by a merge could take
# the instance down exactly while people are being scanned into a venue. The
# server-side script also refuses to run inside a door window (events:door-guard),
# so this is belt and braces.
on:
  workflow_dispatch:

concurrency: production

jobs:
  deploy:
    name: Build & deploy to production
    runs-on: ubuntu-latest
    steps:
      # Fail fast and legibly. An org secret scoped to "selected repositories"
      # silently expands to an empty string in a repo that was never added to
      # it, and the failure surfaces much later as `Bad port ''` from ssh — with
      # no hint that a secret is the cause. Checked via env, never interpolated
      # into the script: DEPLOY_KEY is a multi-line private key.
      - name: Verify the deploy secrets are actually available here
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=(DEPLOY_HOST)
          [ -n "$DEPLOY_PORT" ] || missing+=(DEPLOY_PORT)
          [ -n "$DEPLOY_USER" ] || missing+=(DEPLOY_USER)
          [ -n "$DEPLOY_KEY" ]  || missing+=(DEPLOY_KEY)
          [ -n "$DEPLOY_PATH" ] || missing+=(DEPLOY_PATH)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing deploy secrets: ${missing[*]}"
            echo "DEPLOY_KEY/HOST/PORT/USER live at the nexo-tools org level. If one is"
            echo "scoped to 'selected repositories', this repo has to be added to it"
            echo "(Org settings -> Secrets and variables -> Actions -> the secret ->"
            echo "Repository access). DEPLOY_PATH is per-repo, since each tool lives in"
            echo "its own directory on the server."
            exit 1
          fi
          echo "All five deploy secrets are present."

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Retry ssh-keyscan: a transient network blip must not fail the deploy.
          for i in 1 2 3; do
            if ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts; then
              break
            fi
            echo "ssh-keyscan attempt $i failed; retrying in 5s"
            sleep 5
          done

      - name: Check the door guard before touching anything
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH }} && php artisan events:door-guard"

      # Hostinger's SSH endpoint drops connections under load — the whole
      # ecosystem deploys to the same account, so a normalization pass that
      # pushes several repos at once reliably times a few out. The step used to
      # fail the deploy and wait for a human to re-run it; now it retries, and
      # --partial means a retry resumes instead of starting the upload over.
      - name: Upload built assets
        run: |
          for i in 1 2 3; do
            if rsync -avz --delete --partial \
              -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o ConnectTimeout=30 -o ServerAliveInterval=15" \
              public/build/ \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/public/build/"; then
              exit 0
            fi
            echo "rsync attempt $i failed (Hostinger SSH is flaky under load); retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          echo "rsync failed three times — this is no longer a transient blip."
          exit 1

      # Same retry, same reason. Re-running deploy.sh is safe and is exactly what
      # a manual `gh run rerun --failed` does today, only without the wait.
      - name: Run server-side deploy script
        run: |
          for i in 1 2 3; do
            if ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" \
              -o ConnectTimeout=30 -o ServerAliveInterval=15 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cd ${{ secrets.DEPLOY_PATH }} && { [ -f scripts/deploy.sh ] || git pull origin main; } && NEXO_LEGAL_OPERATOR='${{ vars.NEXO_LEGAL_OPERATOR }}' NEXO_LEGAL_CONTACT='${{ vars.NEXO_LEGAL_CONTACT }}' bash scripts/deploy.sh"; then
              exit 0
            fi
            echo "deploy script attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1
